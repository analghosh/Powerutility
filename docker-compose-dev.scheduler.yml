version: "3.8"

services:
  scheduler-service:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    container_name: dev-scheduler-service
    ports:
      - "${SCHEDULER_PORT}:${SCHEDULER_PORT}"
    volumes:
      - .:/app
      - /var/log/epms/dev-scheduler-service:/var/log/scheduler-service
      - /tmp/jenkins_env/dev:/tmp/jenkins_env
    env_file:
      - ${ENV_FILE}
    environment:
      - SCHEDULER_PORT=8104
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - my_custom_bridge
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SCHEDULER_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  my_custom_bridge:
    external: true
