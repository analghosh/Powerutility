version: "3.8"

services:
  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: dev-ingestion-service
    working_dir: /app/services/ingestion                      # Fix import paths
    ports:
      - "${INGESTION_PORT}:${INGESTION_PORT}"               # dynamic, default 8102 from Jenkins
    volumes:
      - .:/app
      - /var/log/epms/dev-ingestion-service:/var/log/ingestion-service
      - /tmp/jenkins_env/dev:/tmp/jenkins_env               # mounted Jenkins env
    env_file:
      - ${ENV_FILE}                                        # injected by Jenkins
    environment:
      - INGESTION_PORT=8102                                 # fixed port for dev
      - PYTHONPATH=/app/services/ingestion                  # Fix ModuleNotFoundError
    user: "${UID}:${GID}"                                   # injected from Jenkins
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - my_custom_bridge
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: uvicorn app.main:app --host 0.0.0.0 --port ${INGESTION_PORT} --reload

networks:
  my_custom_bridge:
    external: true
