# EPMS — replacement for /etc/nginx/sites-available/application
#
# Base: the live test vhost (epm.ptcindia.com) as read 2026-08-21.
# Each change is marked  # [n]  and written up in docs/EPMS-nginx-changes.md.
#
# NOT INCLUDED: the /scheduler/ loopback lockdown (item 3 in that document).
# Deliberate, 2026-08-21 — it would have taken down the scheduler's own operator
# dashboard and the handed-over /scheduler/docs Swagger URL. The exposure it was
# meant to close is still open; see the note on that block below.
#
# Apply:  sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name epm.ptcindia.com;

    ssl_certificate     /etc/nginx/ssl/ptcindia/ptcindia2026-fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/ptcindia/ptcindia2026.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    # [8] Was: HIGH:!aNULL:!MD5 — permits CBC/SHA-1 suites and does not require
    #     forward secrecy. Mozilla "intermediate" list; TLS 1.3 suites are
    #     negotiated separately and are unaffected by this line.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # [6] VAPT F13 — drop the version from the Server header and error pages.
    server_tokens off;

    root /var/www/applications/client/dist;
    index index.html;

    client_max_body_size 100m;

    access_log /var/log/nginx/epm_access.log;
    error_log  /var/log/nginx/epm_error.log;

    # ---------------------------------------------------------------- SPA ---
    location / {
        try_files $uri $uri/ /index.html;

        # [5] add_header does NOT inherit into a location that declares any of its
        #     own — nginx replaces the inherited set rather than merging it. The
        #     server-level HSTS above is dropped for every response served here the
        #     moment this block gains a single add_header, so it is repeated.
        #     Same rule as proxy_set_header. Fails silently in both directions.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # [4] VAPT F17, vhost half. The API half is fixed in code (911f22f), but
        #     nginx serves index.html straight off disk — it never passes through
        #     SecurityHeadersMiddleware, and CSP is enforced by the browser against
        #     the document it loaded.
        #
        #     ⚠️  SHIPS AS Report-Only ON PURPOSE. Rename to Content-Security-Policy
        #     only after loading Demand Forecast (Windy map + both weather widgets),
        #     a Highcharts screen and an AG Grid screen with the console open and
        #     zero violations logged.
        #
        #     Every external origin below is real, verified in client/dist/index.html
        #     and client/src:
        #       code.highcharts.com   5 <script> tags in index.html
        #       cdn.jsdelivr.net      dragula <script> + <link> in index.html
        #       unpkg.com             Leaflet 1.4.0, WindyChart.jsx:60-61
        #       api.windy.com         libBoot.js, WindyChart.jsx:62
        #       www.windy.com         libBoot.js 302s here for the real bundle; CSP is
        #                             enforced against the redirect TARGET, so it must be named
        #       api.open-meteo.com    CurrentWeather.jsx, WeatherForecastChart.jsx
        #       fonts.googleapis.com  @import in styles.css / styles.scss
        #
        #     'unsafe-inline' is deliberately absent from script-src — including it
        #     defeats the purpose of the header. If Report-Only logs inline-script
        #     violations, fix the script rather than widening the policy.
        #     style-src keeps it: AG Grid and Highcharts set inline styles at runtime.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://code.highcharts.com https://cdn.jsdelivr.net https://unpkg.com https://api.windy.com https://www.windy.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.open-meteo.com https://api.windy.com https://*.windy.com; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        add_header X-Content-Type-Options "nosniff" always;
        # Inert in every current browser; present only so a retest diffing SPA against API
        # responses does not raise a fresh "missing security header" item.
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    }

    # ------------------------------------------------------- Notifications ---
    # [7] SSE for live notifications. Exact-match, so the long read timeout applies
    #     only to the stream and not to ordinary processing requests — an exact
    #     location wins over the /processing/ prefix regardless of file order.
    #     The browser opens this URL verbatim (client/src/config/apiEndpoints.js:412).
    #     Inert until feat/notifications is merged and deployed; harmless before then.
    location = /processing/api/v2/notifications/stream {
        proxy_pass http://127.0.0.1:8003/api/v2/notifications/stream;

        proxy_http_version 1.1;          # 1.0 upstream breaks chunked streaming
        proxy_set_header Connection "";  # do not forward a "close"
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;         # comfortably above HEARTBEAT_SECONDS = 25

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "";
    }

    # --------------------------------------------------------------- Auth ---
    location /auth/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # [1] Was $proxy_add_x_forwarded_for, which APPENDS to the header the client
        #     sent: "X-Forwarded-For: 1.2.3.4" from the client arrives as
        #     "1.2.3.4, <real client>", so anything reading the leftmost entry gets
        #     the address the attacker chose. Five call sites read the header directly
        #     instead of going through get_client_ip: idf_forecast_audit.py:33,
        #     price_group_routes.py:62, realtimemarket_routes.py:53 and
        #     reports_forecast_audit.py:22 all take [0] after split(','), and
        #     libs/core/authz/guard.py:165 fingerprints the raw header for a rate
        #     limiter. EPMS is a single proxy hop, so overwriting is correct and
        #     unspoofable, and $remote_addr has no comma for the [0] readers to trip on.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # [2] Strip the internal service credential from anything arriving off the
        #     internet. AuthMiddleware accepts X-Internal-Token in place of a login
        #     and returns permissions ["*"], which passes every authorization guard.
        #     Internal callers reach each other on 127.0.0.1 and never traverse
        #     nginx, so clearing it here costs nothing and removes the header as a
        #     remote attack path whether or not the secret ever leaks.
        #     nginx omits a header set to the empty string.
        proxy_set_header X-Internal-Token  "";
    }

    # ---------------------------------------------------------- Ingestion ---
    location /ingestion/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # [1]
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "";             # [2]
    }

    # --------------------------------------------------------- Processing ---
    location /processing/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # [1]
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "";             # [2]
    }

    # ---------------------------------------------------------- Scheduler ---
    # ⚠️  STILL PUBLIC — the loopback lockdown (item 3) was deliberately NOT applied.
    #
    #     What remains open, on the deployed code, to anyone with no credential:
    #       POST /scheduler/api/v1/scheduler/bid-trade-live-sync/trigger-dam
    #       POST /scheduler/api/v1/scheduler/bid-trade-live-sync/trigger-rtm
    #       POST /scheduler/api/v1/scheduler/rtm-scheduling/trigger
    #       POST /scheduler/api/v1/scheduler/demand-trigger/trigger
    #       POST /scheduler/api/v1/scheduler/jobs/{job_type}/{enable,disable,trigger}
    #       POST /scheduler/api/v1/scheduler/jobs/reconcile-and-rerun
    #       GET  /scheduler/jobs/audit-logs/search?limit=999999
    #       GET  /scheduler/jobs/{running,statistics,dashboard,trace/{id},...}
    #       GET  /scheduler/queue/*
    #     services/scheduler/app/main.py has AuthMiddleware commented out on both
    #     dev and UAT, and its routers carry no dependencies there.
    #
    #     A blanket deny was rejected because this same prefix serves the scheduler's
    #     own operator UI (/scheduler/{,login,dashboard,config,static/*}, written for
    #     this exact prefix — job_dashboard.html:1445 detectBasePath(), config.py:49
    #     'Set to "/scheduler" in production') and the /scheduler/docs Swagger URL
    #     handed to PTC as a deliverable.
    #
    #     To close it later without breaking those, split by prefix: allowlist the
    #     PTC office / vendor ranges on /scheduler/api/v1/scheduler/ and
    #     /scheduler/jobs/ while leaving the UI and /scheduler/health as they are.
    #     First run:
    #       sudo awk '$7 ~ /^\/scheduler/ {print $1, $7}' /var/log/nginx/epm_access.log* \
    #         | sort | uniq -c | sort -rn | head -30
    #     to see who actually uses it.
    location /scheduler/ {
        proxy_pass http://127.0.0.1:8004/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # [1]
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Token  "";             # [2]
    }

    # ------------------------------------------------------------ Jenkins ---
    # [9] VAPT F11 — an IP allowlist was offered and declined by the client on
    #     2026-08-19, on the basis that Jenkins requires a login. Left commented so
    #     the decision stays visible. Behind that login sit the SSH deploy key,
    #     JWT_SECRET_KEY and every service .env; a symmetric signing key there means
    #     forged super-admin tokens without touching EPMS at all.
    #     Unchanged from the original, including $proxy_add_x_forwarded_for, which
    #     Jenkins' own reverse-proxy checks expect.
    location /jenkins/ {
        # allow <PTC office range>;
        # allow <vendor VPN range>;
        # deny all;

        proxy_pass http://127.0.0.1:8080/jenkins/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
    }
}
