services:
  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: ingestion-service
    ports:
      - "8002:8002"   # Host:Container port mapping
    volumes:
      - /var/log/epms/ingestion-service:/var/log/ingestion-service
      - /tmp/jenkins_env/staging:/tmp/jenkins_env
    env_file:
      - ${ENV_FILE}
    environment:
      - PYTHONPATH=/app/libs:/app/epms_backend:/app/services/ingestion
    user: "${UID}:${GID}"
    networks:
      - my_custom_bridge
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/ingestion/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Since CMD is already defined in Dockerfile, no need to override unless required
    # If you want explicit override, uncomment below:
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8002
