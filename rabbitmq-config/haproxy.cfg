
global
    log 127.0.0.1 local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    retries 3
    timeout connect 5000
    timeout client  50000
    timeout server  50000

listen rabbitmq
    bind *:5672
    mode tcp
    balance roundrobin
    server rabbit1 rabbitmq-node1:5672 check
    server rabbit2 rabbitmq-node2:5672 check
    server rabbit3 rabbitmq-node3:5672 check

listen rabbitmq_management
    bind *:15672
    mode http
    balance roundrobin
    server rabbit1 rabbitmq-node1:15672 check
    server rabbit2 rabbitmq-node2:15672 check
    server rabbit3 rabbitmq-node3:15672 check

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
