services:
  scheduler-service:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    container_name: scheduler-service
    ports:
      - "${SCHEDULER_PORT}:${SCHEDULER_PORT}"
    volumes:
      - .:/app
      - /var/log/epms/scheduler-service:/var/log/scheduler-service
      - /tmp/jenkins_env_scheduler:/tmp/jenkins_env
    env_file:
      - /tmp/jenkins_env_scheduler/scheduler.env
    environment:
      - SCHEDULER_PORT=8004
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - my_custom_bridge
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  my_custom_bridge:
    external: true
