version: "3.8"

services:
  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: auth-service
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"  # dynamic mapping from env
    volumes:
      - .:/app
      - /var/log/epms/auth-service:/var/log/auth-service
      - /tmp/jenkins_env/staging:/tmp/jenkins_env  # mounted Jenkins env
    env_file:
      - ${ENV_FILE}   # injected by Jenkins
    environment:
      - AUTH_PORT=8001
    user: "${UID}:${GID}"  # ensure Jenkins provides these
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - my_custom_bridge
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${AUTH_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  my_custom_bridge:
    external: true
