# Disabled other linters - using Pyright only for cleaner development experience

[tool:pytest]
# libs/tests is listed explicitly: it holds the parser, block-bid routing and
# notification suites, and none of them ran under a bare `pytest` while
# testpaths named only `tests`.
testpaths = tests libs/tests
python_files = test_*.py
python_functions = test_*
# --continue-on-collection-errors: six vendor test files import names that no
# longer exist (services.auth.app.core.rbac, libs.core.authz.guard._bearer, and
# four more). Without this, those six ImportErrors abort collection and pytest
# runs NOTHING -- every other suite in the repo is silently skipped. They are
# still reported as errors and still make the exit code non-zero.
addopts = -v -s --tb=short --continue-on-collection-errors 